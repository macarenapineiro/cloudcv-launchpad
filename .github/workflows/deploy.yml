name: deploy

on:
  push:
    branches: [main]
    paths:
      - "infra/envs/dev/**"
      - "infra/modules/**"
      - "app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  TOFU_VERSION: "1.13.2"

jobs:
  apply:
    name: apply de envs/dev
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # El environment dev exige la aprobación de una de las dos integrantes antes de correr.
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_alert_emails: ${{ secrets.ALERT_EMAILS }}
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: tofu init
        working-directory: infra/envs/dev
        run: tofu init -input=false

      - name: tofu apply
        working-directory: infra/envs/dev
        shell: bash
        run: tofu apply -input=false -auto-approve -no-color -lock-timeout=120s 2>&1 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/***@***/g'

            - name: nombre de la Function
        id: fn
        working-directory: infra/envs/dev
        run: echo "nombre=$(tofu output -raw function_app_name)" >> "$GITHUB_OUTPUT"

      - name: login a Azure con OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: subir el código de la Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.fn.outputs.nombre }}
          package: app/function
          sku: flexconsumption
          remote-build: true
          respect-funcignore: true

      - name: direcciones del despliegue
        working-directory: infra/envs/dev
        run: |
          echo "sitio:   $(tofu output -raw sitio)"
          echo "api:     $(tofu output -raw api_url)"